name: Build safe llama-cpp-python Windows CUDA wheel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout llama-cpp-python
        uses: actions/checkout@v6
        with:
          repository: abetlen/llama-cpp-python
          ref: main
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: llamacpp
          python-version: "3.12"
          miniforge-version: latest

      - name: Install CUDA 12.4 build tools
        shell: pwsh
        run: |
          $cudaChannel = "nvidia/label/cuda-12.4.1"

          mamba install -y `
            --channel-priority flexible `
            --override-channels `
            -c $cudaChannel `
            "${cudaChannel}::cuda-nvcc_win-64" `
            "${cudaChannel}::cuda-cccl" `
            "${cudaChannel}::cuda-libraries-dev=12.4.1" `
            "${cudaChannel}::cuda-cudart" `
            "${cudaChannel}::cuda-cudart-dev"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel ninja

      - name: Locate CUDA
        shell: pwsh
        run: |
          $cudaRoot = Join-Path $env:CONDA_PREFIX "Library"

          $nvcc = @(
            (Join-Path $env:CONDA_PREFIX "Library\bin\nvcc.exe"),
            (Join-Path $env:CONDA_PREFIX "bin\nvcc.exe")
          ) |
          Where-Object { Test-Path $_ } |
          Select-Object -First 1

          if (-not $nvcc) {
            throw "nvcc.exe not found"
          }

          "CUDA_ROOT=$cudaRoot" >> $env:GITHUB_ENV
          "NVCC_PATH=$nvcc" >> $env:GITHUB_ENV

          & $nvcc --version

      - name: Build safe CUDA wheel
        shell: pwsh
        run: |
          $cudaRoot = $env:CUDA_ROOT
          $nvcc = $env:NVCC_PATH

          $cudaRootCmake = $cudaRoot.Replace('\','/')
          $nvccCmake = $nvcc.Replace('\','/')

          $env:CUDA_PATH = $cudaRoot
          $env:CUDA_HOME = $cudaRoot
          $env:CUDAToolkit_ROOT = $cudaRoot
          $env:CUDACXX = $nvccCmake
          $env:CMAKE_GENERATOR = "Ninja"

          $env:CMAKE_ARGS = @(
            "-DGGML_CUDA=ON"
            "-DGGML_CUDA_FORCE_MMQ=ON"
            "-DCMAKE_CUDA_ARCHITECTURES=89"
            "-DCMAKE_CUDA_COMPILER=$nvccCmake"
            "-DCUDAToolkit_ROOT=$cudaRootCmake"

            "-DGGML_NATIVE=OFF"
            "-DGGML_CPU_ALL_VARIANTS=OFF"

            "-DGGML_AVX=ON"
            "-DGGML_AVX2=ON"

            "-DGGML_AVX512=OFF"
            "-DGGML_AVX512_VBMI=OFF"
            "-DGGML_AVX512_VNNI=OFF"
            "-DGGML_AVX512_BF16=OFF"

            "-DGGML_LLAMAFILE=OFF"
          ) -join " "

          Write-Host "CMAKE_ARGS:"
          Write-Host $env:CMAKE_ARGS

          python -m build --wheel

      - name: Show wheel
        shell: pwsh
        run: |
          Get-ChildItem dist\*.whl |
            Select-Object Name, Length, FullName |
            Format-Table -AutoSize

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: llama-cpp-python-win-cu124-safe
          path: dist/*.whl
          if-no-files-found: error
